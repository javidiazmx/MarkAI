# Everything Mark is allowed to learn from. Add entries, save, then run: mark ingest
#
# Three kinds of material: websites, YouTube episodes, and your podcast.
# Nothing else is used. If it is not listed here, Mark does not know it.
#
# FORMATO: cada sitio es un bloque que empieza con "  - url:". Los demas campos van
# indentados con 4 espacios. Nunca uses Tab, solo espacios: YAML rechaza los tabs.
#
# Private feed URL with a token in it? Copy this file to sources/sources.local.yaml
# and edit that instead. Mark prefers the local file and git ignores it.

# ---------------------------------------------------------------------------------------
# WEBSITES
#
# crawl: true  = lee esa pagina y sigue los enlaces del mismo sitio, hasta max_pages.
# crawl: false = lee solo esa pagina.
#
# OJO con los sitios de gobierno: son enormes (chicago.gov e ilga.gov tienen decenas de
# miles de paginas). Un crawl desde la portada agarra menus, notas de prensa y programas
# que no tienen que ver con arrendamiento, y eso ENSUCIA las respuestas de Mark. Los
# max_pages de abajo son un punto de partida conservador. Despues del primer ingest
# revisa con `mark sources list` que trajo, y cambia la url por la seccion exacta que
# si sirve (por ejemplo la pagina del RLTO en vez de todo chicago.gov).
# ---------------------------------------------------------------------------------------
websites:
  # --- Tu propio sitio: lo mas valioso, y aqui si vale la pena ir a fondo ---------------
  - url: https://gcrealtyinc.com
    title: GC Realty & Development
    crawl: true
    max_pages: 200
    exclude_patterns: ["/wp-", "/tag/", "/author/", "/page/", "/feed", "/cart", "/checkout"]
    notes: Sitio propio, incluye todo el blog.

  # --- Condados de Chicagoland ---------------------------------------------------------
  - url: https://www.cookcountyil.gov/
    title: Cook County
    crawl: true
    max_pages: 60
    exclude_patterns: ["/news", "/event", "/calendar", "/search", "/es/"]

  - url: https://www.dupagecounty.gov/
    title: DuPage County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.kanecountyil.gov/
    title: Kane County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.kendallcountyil.gov/
    title: Kendall County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.lakecountyil.gov/
    title: Lake County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.mchenrycountyil.gov/
    title: McHenry County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.willcounty.gov/
    title: Will County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  # --- Estado de Illinois --------------------------------------------------------------
  - url: https://www.ilga.gov/
    title: Illinois General Assembly
    crawl: true
    max_pages: 40
    exclude_patterns: ["/senate", "/house", "/commission", "/legislation/votes", "/search"]
    notes: Sitio gigantesco. Considera apuntar directo al capitulo 765 ILCS.

  - url: https://dhr.illinois.gov/
    title: Illinois Department of Human Rights
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search"]

  - url: https://illinoisattorneygeneral.gov/
    title: Illinois Attorney General
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/press", "/event", "/search"]

  - url: https://www.illinoiscourts.gov/
    title: Illinois Courts
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search", "/opinions"]

  - url: https://tax.illinois.gov/
    title: Illinois Department of Revenue
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search"]

  - url: https://www.ihda.org/
    title: Illinois Housing Development Authority
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search"]

  - url: https://www.cmap.illinois.gov/
    title: Chicago Metropolitan Agency for Planning
    crawl: true
    max_pages: 30
    exclude_patterns: ["/news", "/event", "/search"]

  # --- Ciudad de Chicago ---------------------------------------------------------------
  - url: https://www.chicago.gov/
    title: City of Chicago
    crawl: true
    max_pages: 60
    exclude_patterns: ["/news", "/event", "/press", "/search", "/es/"]
    notes: Enorme. Lo ideal seria apuntar a la seccion del RLTO y de building code.

  - url: https://www.chicityclerk.com/
    title: Chicago City Clerk
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search"]

  # --- Federal -------------------------------------------------------------------------
  - url: https://www.hud.gov/
    title: HUD
    crawl: true
    max_pages: 50
    exclude_patterns: ["/press", "/news", "/event", "/search", "/espanol"]

  - url: https://www.justice.gov/
    title: US Department of Justice
    crawl: true
    max_pages: 30
    exclude_patterns: ["/news", "/press", "/opa", "/event", "/search", "/es/"]
    notes: Solo interesa la parte de fair housing. Considera acotar la url.

  - url: https://www.epa.gov/
    title: EPA
    crawl: true
    max_pages: 30
    exclude_patterns: ["/news", "/press", "/event", "/search", "/espanol"]
    notes: Solo interesa lead-based paint. Considera acotar la url.

# ---------------------------------------------------------------------------------------
# YOUTUBE
# Mark lee los subtitulos que YouTube ya tiene, asi que no necesita API key.
#
# IMPORTANTE: aqui van URLs de VIDEOS individuales, no de canales. Una URL de canal
# (youtube.com/@loquesea) no se puede usar directamente. Pon la lista de videos en
# sources/youtube_urls.txt, una URL por linea, y apunta urls_file a ese archivo.
# ---------------------------------------------------------------------------------------
youtube:
  channel_url: https://www.youtube.com/@straightupchicagoinvestor
  channel_name: Straight Up Chicago Investor
  urls_file: sources/youtube_urls.txt
  episodes: []

# ---------------------------------------------------------------------------------------
# PODCAST
# Order of preference for each episode, cheapest first:
#   1. A transcript file you drop in data/raw/podcast/transcripts/ (.srt .vtt .txt .json)
#   2. A <podcast:transcript> link in your RSS feed (some hosts add this automatically)
#   3. Local transcription of the audio - slow, roughly one hour of compute per hour of audio,
#      and it needs:  pip install "markai[transcribe]"
# Easiest of all: if the episode is also on YouTube, list it under youtube above instead.
#
# How a transcript file gets matched to an episode:
#   - an explicit transcript_file always wins, or
#   - the filename contains the episode number as a standalone number (212 matches "Ep 212.srt"), or
#   - the filename matches at least 80% of the words in the episode title.
# Run `mark sources match` to see exactly what matched before you ingest.
# ---------------------------------------------------------------------------------------
podcast:
  show_name: Straight Up Chicago Investor
  rss: https://feeds.libsyn.com/262421/rss
  include_titles: []          # only these episodes; matches part of a title, or an episode number
  max_episodes: 25            # start small; raise it once the first run looks right
  episodes: []

