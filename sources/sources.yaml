  # --- Federal -------------------------------------------------------------------------
  - url: https://www.hud.gov/
    title: HUD
    crawl: true
    max_pages: 50
    exclude_patterns: ["/press", "/news", "/event", "/search", "/espanol"]

  - url: https://www.justice.gov/
    title: US Department of Justice
    crawl: true
    max_pages: 30
    exclude_patterns: ["/news", "/press", "/opa", "/event", "/search", "/es/"]
    notes: Solo interesa la parte de fair housing. Considera acotar la url.

  - url: https://www.epa.gov/
    title: EPA
    crawl: true
    max_pages: 30
    exclude_patterns: ["/news", "/press", "/event", "/search", "/espanol"]
    notes: Solo interesa lead-based paint. Considera acotar la url.

# ---------------------------------------------------------------------------------------
# YOUTUBE
# Mark lee los subtitulos que YouTube ya tiene, asi que no necesita API key.
#
# Puedes poner canales completos en "channels" (Mark lista los videos solo), videos
# sueltos en "episodes", o una lista en un archivo aparte con "urls_file".
# ---------------------------------------------------------------------------------------
youtube:
  # Canales completos. Mark saca la lista de videos solo y guarda un cache; al re-ingestar
  # con --force vuelve a leer el canal y agarra los videos nuevos.
  channels:
    - https://www.youtube.com/@straightupchicagoinvestor
    - https://www.youtube.com/@MarkAinleyGCRealty
  # TODOS los videos largos de ambos canales. Los shorts se descartan primero.
  # Son miles de peticiones a YouTube, y va a bloquear la IP en algun punto: el ingest se
  # detiene solo cuando eso pasa y te avisa. Lo ya descargado queda en cache, asi que basta
  # con volver a correr `mark ingest` mas tarde y sigue donde se quedo. Puede tomar varias
  # sesiones hasta completar el catalogo.
  max_videos_per_channel: null
  skip_shorts: true          # los shorts no aportan y ensucian las busquedas
  max_short_seconds: 180     # cualquier video de 3 min o menos cuenta como short
  channel_name: Straight Up Chicago Investor
  urls_file: sources/youtube_urls.txt   # opcional, para videos sueltos de otros canales
  episodes: []                          # opcional, para nombrar un video a mano
  # Videos que YouTube bloquea en cada intento (IP nueva, cookies, VPN, hasta la API oficial
  # con OAuth del dueno del canal) - no es un problema de credenciales, es este video en
  # particular. Sin esto, cada corrida gasta sus 2 reintentos consecutivos aqui y se detiene
  # antes de llegar al resto del catalogo.
  skip_video_ids:
    - I3XTfirzDs0
    - iAcf6m3trN0
    - oGUpaJJdkPI

# ---------------------------------------------------------------------------------------
# PODCAST
# Order of preference for each episode, cheapest first:
#   1. A transcript file you drop in data/raw/podcast/transcripts/ (.srt .vtt .txt .json)
#   2. A <podcast:transcript> link in your RSS feed (some hosts add this automatically)
#   3. Local transcription of the audio - slow, roughly one hour of compute per hour of audio,
#      and it needs:  pip install "markai[transcribe]"
# Easiest of all: if the episode is also on YouTube, list it under youtube above instead.
#
# How a transcript file gets matched to an episode:
#   - an explicit transcript_file always wins, or
#   - the filename contains the episode number as a standalone number (212 matches "Ep 212.srt"), or
#   - the filename matches at least 80% of the words in the episode title.
# Run `mark sources match` to see exactly what matched before you ingest.
# ---------------------------------------------------------------------------------------
# COBERTURA COMPLETA DEL PODCAST: viene por YouTube, no por aqui.
# Cada episodio esta publicado en el canal, con subtitulos que YouTube regala. Transcribir
# el audio en local daria el mismo texto a razon de ~1 hora de CPU por hora de audio: para
# el catalogo completo serian semanas de computadora para duplicar lo que ya tienes gratis.
# El feed se queda configurado para aportar numero de episodio, fecha y liga a las notas,
# y por si algun dia Libsyn publica transcripciones. Corre el ingest con --no-transcribe.
podcast:
  show_name: Straight Up Chicago Investor
  rss: https://feeds.libsyn.com/262421/rss
  include_titles: []          # only these episodes; matches part of a title, or an episode number
  # El feed trae 480 episodios. Libsyn no publica transcripciones, asi que de cada episodio
  # se guardan las NOTAS del show: invitado, temas, marcas de tiempo y ligas. Es contenido
  # real y ya viene en el feed. El transcript completo llega por YouTube.
  # Corre siempre con --no-transcribe.
  max_episodes: null
  episodes: []

# ---------------------------------------------------------------------------------------
# TOOLS Mark can recommend when they fit the question.
# ---------------------------------------------------------------------------------------
tools:
  - name: Free Rental Analysis
    description: GC Realty corre el analisis de renta de la unidad y te manda el numero.
    url: https://www.gcrealtyinc.com/free-rental-analysis
    when_to_recommend: >
      Cuando preguntan cuanto renta una unidad o un edificio en concreto. Jay no tiene
      comparables en vivo, asi que esta es la respuesta honesta a "cuanto vale mi renta".

  # No hay un directorio de vendors. La pagina Build Your Team es de otro tipo de gente,
  # asi que no se manda a nadie para alla: la referencia la da Mark por correo.
  - name: Referencia de vendor por correo con Mark
    description: >
      Mark refiere al oficio adecuado cuando le escribes a mark@gcrealtyinc.com con lo que
      necesitas, donde esta la propiedad y TU TELEFONO. No hay directorio publico que
      consultar.
    when_to_recommend: >
      Cuando piden un contacto de un oficio o especialidad - caldera, alcantarillado,
      board-up, un abogado de arrendamiento - y no hay un nombre en las fuentes. Diles que
      le escriban a mark@gcrealtyinc.com con la direccion, que necesitan y su telefono, y
      que Mark ve si puede referirlos. Pide siempre el telefono: sin el, referir a alguien
      toma dos correos mas.

  - name: Llamada de 20 minutos con Russell
    description: Property manager de GC Realty. Revisa el caso contigo por telefono.
    url: https://calendly.com/russell-wedge-gcrealtyinc/20min
    when_to_recommend: >
      Solo cuando el caso se paso de lo que un chat resuelve. En una pregunta rutinaria se
      lee como que lo estas quitando de encima.

