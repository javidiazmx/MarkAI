# ---------------------------------------------------------------------------------------
# YOUTUBE
# Mark lee los subtitulos que YouTube ya tiene, asi que no necesita API key.
#
# Puedes poner canales completos en "channels" (Mark lista los videos solo), videos
# sueltos en "episodes", o una lista en un archivo aparte con "urls_file".
# ---------------------------------------------------------------------------------------
youtube:
  # Canales completos. Mark saca la lista de videos solo y guarda un cache; al re-ingestar
  # con --force vuelve a leer el canal y agarra los videos nuevos.
  channels:
    - https://www.youtube.com/@straightupchicagoinvestor
    - https://www.youtube.com/@MarkAinleyGCRealty
  # TODOS los videos largos de ambos canales. Los shorts se descartan primero.
  # Son miles de peticiones a YouTube, y va a bloquear la IP en algun punto: el ingest se
  # detiene solo cuando eso pasa y te avisa. Lo ya descargado queda en cache, asi que basta
  # con volver a correr `mark ingest` mas tarde y sigue donde se quedo. Puede tomar varias
  # sesiones hasta completar el catalogo.
  max_videos_per_channel: null
  skip_shorts: true          # los shorts no aportan y ensucian las busquedas
  max_short_seconds: 180     # cualquier video de 3 min o menos cuenta como short
  channel_name: Straight Up Chicago Investor
  urls_file: sources/youtube_urls.txt   # opcional, para videos sueltos de otros canales
  episodes: []                          # opcional, para nombrar un video a mano

# ---------------------------------------------------------------------------------------
# PODCAST
# Order of preference for each episode, cheapest first:
#   1. A transcript file you drop in data/raw/podcast/transcripts/ (.srt .vtt .txt .json)
#   2. A <podcast:transcript> link in your RSS feed (some hosts add this automatically)
#   3. Local transcription of the audio - slow, roughly one hour of compute per hour of audio,
#      and it needs:  pip install "markai[transcribe]"
# Easiest of all: if the episode is also on YouTube, list it under youtube above instead.
#
# How a transcript file gets matched to an episode:
#   - an explicit transcript_file always wins, or
#   - the filename contains the episode number as a standalone number (212 matches "Ep 212.srt"), or
#   - the filename matches at least 80% of the words in the episode title.
# Run `mark sources match` to see exactly what matched before you ingest.
# ---------------------------------------------------------------------------------------
# COBERTURA COMPLETA DEL PODCAST: viene por YouTube, no por aqui.
# Cada episodio esta publicado en el canal, con subtitulos que YouTube regala. Transcribir
# el audio en local daria el mismo texto a razon de ~1 hora de CPU por hora de audio: para
# el catalogo completo serian semanas de computadora para duplicar lo que ya tienes gratis.
# El feed se queda configurado para aportar numero de episodio, fecha y liga a las notas,
# y por si algun dia Libsyn publica transcripciones. Corre el ingest con --no-transcribe.
podcast:
  show_name: Straight Up Chicago Investor
  rss: https://feeds.libsyn.com/262421/rss
  include_titles: []          # only these episodes; matches part of a title, or an episode number
  max_episodes: 25            # start small; raise it once the first run looks right
  episodes: []

