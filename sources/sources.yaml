# Everything Mark is allowed to learn from. Add entries, save, then run: mark ingest
#
# Three kinds of material: websites, YouTube episodes, and your podcast.
# Nothing else is used. If it is not listed here, Mark does not know it.
#
# FORMATO: cada sitio es un bloque que empieza con "  - url:". Los demas campos van
# indentados con 4 espacios. Nunca uses Tab, solo espacios: YAML rechaza los tabs.
#
# Private feed URL with a token in it? Copy this file to sources/sources.local.yaml
# and edit that instead. Mark prefers the local file and git ignores it.

# ---------------------------------------------------------------------------------------
# WEBSITES
#
# crawl: true  = lee esa pagina y sigue los enlaces del mismo sitio, hasta max_pages.
# crawl: false = lee solo esa pagina.
#
# OJO con los sitios de gobierno: son enormes (chicago.gov e ilga.gov tienen decenas de
# miles de paginas). Un crawl desde la portada agarra menus, notas de prensa y programas
# que no tienen que ver con arrendamiento, y eso ENSUCIA las respuestas de Mark. Los
# max_pages de abajo son un punto de partida conservador. Despues del primer ingest
# revisa con `mark sources list` que trajo, y cambia la url por la seccion exacta que
# si sirve (por ejemplo la pagina del RLTO en vez de todo chicago.gov).
# ---------------------------------------------------------------------------------------
websites:
  # --- Sitios propios: lo mas valioso, aqui si va todo -----------------------------------
  # FICHAS DE PROPIEDADES: fuera. Cada una es la misma plantilla de marketing con una
  # direccion distinta, no aportan nada a una pregunta de arrendamiento, y rotan cada
  # semana. Ya se comieron 48 paginas del presupuesto en una corrida anterior.
  #
  # Las paginas del sitio (servicios, quienes somos, casos) son unos cientos; el blog va
  # aparte abajo con su propia semilla, asi que aqui no hace falta un tope grande.
  - url: https://www.gcrealtyinc.com
    title: GC Realty & Development
    crawl: true
    max_pages: 400
    exclude_patterns: &sin_fichas
      - "/wp-admin"
      - "/wp-login"
      - "/feed"
      - "/cart"
      - "/checkout"
      - "/my-account"
      # Sin barra al inicio a proposito: son regex, y la ruta real es
      # /chicago-homes-for-rent, no /homes-for-rent.
      - "_system/listings"       # fichas individuales
      - "listings/"
      - "homes-for-rent"         # indices de disponibilidad
      - "properties-for-rent"
      - "houses-for-rent"
      - "apartments-for-rent"
      - "available-rental"
      - "vacanc"
      - "property-search"
      - "rental-search"
      - "tenant-portal"
      - "owner-portal"
      - "/application"
    notes: Paginas del sitio. Las fichas de propiedades quedan excluidas a proposito.

  # EL BLOG VIENE DEL SITEMAP, no de seguir enlaces. Los articulos viejos solo se alcanzan
  # por la paginacion (/blog?pg=2, ?pg=3...), asi que un crawl normal se queda en los
  # primeros. El sitio publica sus 678 articulos en su propio sitemap: esa lista es
  # completa por definicion. Comprobar con:
  #   mark sources missing https://www.gcrealtyinc.com --section /blog
  - url: https://www.gcrealtyinc.com/blog
    title: GC Realty blog
    from_sitemap: true
    max_pages: 3000
    include_patterns: ["/blog"]
    exclude_patterns: ["/tag/", "/author/", "/category/", "/feed"]

  # OJO: la portada de straightupchicagoinvestor.com sirve una copia del sitio de GC Realty
  # (mismo titulo, mismas paginas). Las notas del podcast viven bajo /podcast, y esa es la
  # ruta que declara el propio feed RSS. Apuntamos ahi para no traer el sitio duplicado.
  - url: https://www.straightupchicagoinvestor.com/podcast
    title: Straight Up Chicago Investor (notas de episodios)
    crawl: true
    max_pages: 500
    include_patterns: ["/podcast"]
    exclude_patterns: ["/wp-admin", "/wp-login", "/feed", "/cart", "/checkout", "/_system/listings"]
    notes: Notas de cada episodio. La portada del dominio se omite a proposito.

  # Directorio de oficios de la comunidad del podcast. Como fuente para que Jay sepa que
  # hay ahi, y como tool arriba para mandarlos a la pagina.
  - url: https://www.straightupchicagoinvestor.com/build-your-team
    title: Build Your Team (directorio de vendors)
    crawl: true
    max_pages: 60
    include_patterns: ["build-your-team", "/team", "/vendor"]

  # --- Condados de Chicagoland ---------------------------------------------------------
  - url: https://www.cookcountyil.gov/
    title: Cook County
    crawl: true
    max_pages: 60
    exclude_patterns: ["/news", "/event", "/calendar", "/search", "/es/"]

  - url: https://www.dupagecounty.gov/
    title: DuPage County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.kanecountyil.gov/
    title: Kane County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.kendallcountyil.gov/
    title: Kendall County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.lakecountyil.gov/
    title: Lake County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.mchenrycountyil.gov/
    title: McHenry County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  - url: https://www.willcounty.gov/
    title: Will County
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/calendar", "/search"]

  # --- Estado de Illinois --------------------------------------------------------------
  - url: https://www.ilga.gov/
    title: Illinois General Assembly
    crawl: true
    max_pages: 40
    exclude_patterns: ["/senate", "/house", "/commission", "/legislation/votes", "/search"]
    notes: Sitio gigantesco. Considera apuntar directo al capitulo 765 ILCS.

  - url: https://dhr.illinois.gov/
    title: Illinois Department of Human Rights
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search"]

  - url: https://illinoisattorneygeneral.gov/
    title: Illinois Attorney General
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/press", "/event", "/search"]

  - url: https://www.illinoiscourts.gov/
    title: Illinois Courts
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search", "/opinions"]

  - url: https://tax.illinois.gov/
    title: Illinois Department of Revenue
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search"]

  - url: https://www.ihda.org/
    title: Illinois Housing Development Authority
    crawl: true
    max_pages: 40
    exclude_patterns: ["/news", "/event", "/search"]

  - url: https://www.cmap.illinois.gov/
    title: Chicago Metropolitan Agency for Planning
    crawl: true
    max_pages: 30
