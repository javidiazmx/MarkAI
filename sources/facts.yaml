    jurisdiction: "Illinois"
    topic: "Mandatory fee disclosure"
    rule: "All non-optional fees, one-time and monthly recurring, must be disclosed in the listing (or a web link from it) and on the first page of the lease; if not disclosed, the tenant does not have to pay that fee."
    citation: "Illinois Landlords & Rental Property Managers: 2026 FAQ"
    url: "https://www.gcrealtyinc.com/blog/illinois-landlords--rental-property-managers-2026-faq"
    notes: "From: All non-optional (mandatory) fees. One-time and monthly recurring. They have to appear in two places: - The listing (or a web link directly from the listing). - The first page of the lease. Penalty for missing a disclosure: the tenant does not have to pay that fee. (stated in 2 of your sources)"
