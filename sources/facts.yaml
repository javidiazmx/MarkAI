    jurisdiction: "Illinois"
    topic: "Assistance animals"
    rule: "Assistance animals are not pets; no certification or training required, no size/weight/breed restrictions based on speculation, no limit to number if disability-related need exists, but the animal must be vaccinated and housebroken. Providers cannot charge pet fees, deposits, or rent, require liability insurance, deny based on breed alone, or deny based on other residents' allergies without evidence of actual direct threat."
    citation: "Illinois Department of Human Rights \u2013 Disability Rights"
    url: "https://dhr.illinois.gov/rights/disability-rights.html"
    notes: "From: - Assistance animals can be any type of animal\n- There are no size, weight, or breed restrictions based on speculation\n- You do not need certification or training\n- There is no limit to number if disability-related need exists\n- Your assistance animal must be vaccinated and housebroken\nProviders cannot:\n- Charge pet fees, deposits, or rent\n- Require liability insurance\n- Deny based on breed alone\n- Deny based on other residents' allergies without evidence of actual direct threat (stated in 2 of your sources)"
