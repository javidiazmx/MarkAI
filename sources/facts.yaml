ordinances:
  - id: mined-462
    jurisdiction: "Chicago"
    topic: "Minimum ceiling height by room type"
    rule: "Habitable rooms and hallways inside the dwelling unit: 7 feet minimum; bathrooms, toilet rooms, laundry rooms: 6 feet 8 inches minimum; projections such as ducts, beams, girders in basements: 6 feet 4 inches permitted."
    citation: "Chicago Garden and Basement Apartment Ceiling Requirements"
    url: "https://www.gcrealtyinc.com/blog/chicago-garden-and-basement-apartment-ceiling-requirements"
    notes: "From: - Habitable rooms in a dwelling unit: 7 feet minimum\n- Hallways inside the dwelling unit: 7 feet minimum\n- Bathrooms, toilet rooms, and laundry rooms: 6 feet 8 inches minimum\n- Projections such as ducts, beams, and girders in basements: 6 feet 4 inches permitted"
  - id: mined-461
    jurisdiction: "Chicago"
    topic: "One-time right to cure"
    rule: "In nonpayment eviction cases, a tenant may dismiss the case and stay by paying unpaid rent plus the landlord's court filing fees (not attorney's fees) any time before an order of possession is entered."
    citation: "Chicago Fair Notice Ordinance"
    url: "https://www.gcrealtyinc.com/blog/chicagos-fair-housing-ordinance-v2"
    notes: "From: A tenant can dismiss the eviction case and remain in the unit by paying the unpaid rent plus the landlord\u2019s court filing fees (not attorney\u2019s fees) at any time before a judge issues a formal eviction order (order of possession)."
  - id: mined-460
    jurisdiction: "Illinois"
    topic: "Security deposits"
    rule: "Landlords may not charge a non-refundable security deposit; it must be refundable at the end of tenancy after deducting unpaid rent or damages beyond normal wear and tear."
    citation: "Understanding Illinois Security Deposit Laws"
    url: "https://www.gcrealtyinc.com/blog/understanding-illinois-security-deposit-laws"
    notes: "From: In Illinois, landlords cannot charge a non-refundable security deposit."
  - id: mined-459
    jurisdiction: "Chicago"
    topic: "Income and credit screening criteria"
    rule: "Net income must equal 4x monthly rent; 3 most recent pay stubs or proof of self-employed income required; minimum 6 months at current employment or same industry; no past due balances; positive rental or mortgage history within last 18 months."
    citation: "Chicago Property Management, Chicago Property Managers, Chicago Property Management Companies. GC Realty & Development, LLC"
    url: "https://www.gcrealtyinc.com/leasing-faq"
    notes: "From: 700 or greater. - Net income must equal 4x the monthly rent amount. 3 most recent pay stubs or proof of self-employed income required. - A minimum of 6 months at current employment or within the same industry is required. - Cannot have any past due balances. - Must have positive rental or mortgage history within the last 18 months."
  - id: mined-458
    jurisdiction: "Chicago"
    topic: "Restricted Residential Zone duration"
    rule: "A Restricted Residential Zone remains in effect for four years after the effective date of the establishing ordinance unless repealed earlier."
    citation: "House Sharing FAQ"
    url: "https://www.chicityclerk.com/house-sharing-faq"
    notes: "From: The Restricted Residential Zone will remain in effect for four years following the effective date of the Ordinance establishing the zone unless the Restricted Residential Zone is repealed before the four-year"
  - id: mined-457
    jurisdiction: "Chicago"
    topic: "Water heater replacement inspections"
    rule: "Be aware of required inspections when replacing hot water heaters."
    citation: "Episode 311: Managing and Operating 100+ Units at 25 Years Old with James Thompson"
    url: "https://traffic.libsyn.com/secure/straightupchicagoinvestor/SUCI311.mp3"
    notes: "From: 03:30 Housing Provider Tip - Be aware of required inspections when replacing hot water heaters! [page dated 2024-07-25]"
  - id: mined-456
    jurisdiction: "Chicago"
    topic: "Porch repair permits"
    rule: "Anything structural on a porch generally requires a permit; a permit and inspection may trigger broader compliance issues on older porches."
    citation: "The 101 on Porch Issues and Repairs With Mr. Porch Frank Knight"
    url: "https://www.gcrealtyinc.com/podcasts/the-101-on-porch-issues-and-repairs-with-mr-porch-frank-knight"
    notes: "From: A: Frank explains that anything structural generally requires a permit, but older porches can get complicated because a permit and inspection may trigger broader compliance issues."
  - id: mined-455
    jurisdiction: "Chicago"
    topic: "Minimum daytime heat temperature"
    rule: "Minimum indoor temperature of 68\u00b0 from 8:30 am to 10:30 pm every day during the heating season."
    citation: "What Is the Chicago Heat Ordinance"
    url: "https://www.gcrealtyinc.com/blog/what-is-the-chicago-heat-ordinance"
    notes: "From: 68\u00b0 is the minimum temperature from 8:30 am to 10:30 pm every day of the week for the entire heating season."
  - id: mined-454
    jurisdiction: "Illinois"
    topic: "Assistance animal insurance"
    rule: "A landlord cannot require a resident to carry special liability insurance for an assistance animal as a condition of approval."
    citation: "Assistance Animal Integrity Act"
    url: "https://www.gcrealtyinc.com/blog/when-i-cant-charge-pet-fees-in-chicago"
    notes: "From: You also cannot make the resident carry special liability insurance for the animal as a condition of approving it."
  - id: mined-453
    jurisdiction: "Chicago"
    topic: "CHA HQS inspections \u2014 smoke/CO detectors"
    rule: "Smoke and CO detectors are required in all units, especially near bedrooms; CHA treats a missing/nonfunctioning detector as an emergency that must be fixed within 24 hours."
    citation: "Chicago Housing Authority Housing Quality Standards (HUD HQS)"
    url: "https://www.gcrealtyinc.com/blog/all-you-need-to-know-about-cha-inspections"
    notes: "From: Lack of functioning smoke/carbon monoxide detectors - Smoke and CO detectors are required in all units, especially near bedrooms. This is considered an emergency by CHA and must be addressed within 24hrs."
  - id: mined-452
    jurisdiction: "Chicago"
    topic: "Registration of single family and condo rentals (proposed)"
    rule: "Owners renting out a single family home or a condo they do not occupy would have to register and pay the fee; the only fee exemption is owner occupied buildings with two to six units and nonprofit affordable housing."
    citation: "Brandon Johnson's Protecting Renters Ordinance Could End Up Hurting The Renters It Wants To Help"
    url: "https://www.gcrealtyinc.com/blog/brandon-johnsons-protecting-renters-ordinance-could-end-up-hurting-the-renters-it-wants-to-help"
    notes: "From: The only fee exemption is for owner occupied buildings with two to six units and for nonprofit affordable housing."
  - id: mined-451
    jurisdiction: "Cook County (unincorporated)"
    topic: "Essential services"
    rule: "Landlords must provide essential services (heat, running water, hot water, electricity, plumbing) in good working order; failure is an emergency permitting rent deduction or lease termination."
    citation: "Cook County Residential Tenant Landlord Ordinance (RTLO)"
    url: "https://www.gcrealtyinc.com/blog/the-cook-county-rtlo-what-landlords-need-to-know"
    notes: "From: \u2022 Essential services: Landlords must provide essential services like heat, running water, hot water, electricity, and plumbing in good working order. Failure to provide essential services constitutes an emergency and allows tenants to deduct a portion of rent or terminate the lease."
  - id: mined-450
    jurisdiction: "DuPage County"
    topic: "Voucher size vs bedroom count"
    rule: "The housing authority pays based on voucher size, not the unit's actual bedroom count."
    citation: "DuPage County Section 8: How to Know What the Housing Authority Will Actually Pay You"
    url: "https://www.gcrealtyinc.com/blog/dupage-county-section-8-how-to-know-what-the-housing-authority-will-actually-pay-you"
    notes: "From: The housing authority pays based on voucher size, not your actual bedroom count."
  - id: mined-449
    jurisdiction: "Illinois"
    topic: "Smoke detectors"
    rule: "Illinois requires 10 year sealed smoke detector units"
    citation: "Rental Licenses Around Chicago: What Landlords Need To Know Before They Buy, Rent, Or Renew"
    url: "https://www.gcrealtyinc.com/blog/rental-licenses-around-chicago-what-landlords-need-to-know-before-they-buy-rent-or-renew"
    notes: "From: - Illinois now requires 10 year sealed units, which are great long term but more expensive up front."
  - id: mined-448
    jurisdiction: "Federal (HUD Section 8 HQS)"
    topic: "Smoke and carbon monoxide detectors"
    rule: "HQS inspections fail units with missing, inoperable, or incorrectly mounted smoke and carbon monoxide detectors; detectors must be hardwired."
    citation: "Top 10 Section 8 HQS Inspection Fail Items"
    url: "https://www.gcrealtyinc.com/blog/top-10-section-8-hqs-inspection-fail-items"
    notes: "From: Smoke Detectors: Missing, inoperable or incorrectly mounted smoke and carbon monoxide detectors (must be hardwired)"
  - id: mined-447
    jurisdiction: "Federal"
    topic: "Section 8 voucher inspections"
    rule: "Units inspected within the past year under another federal housing program can satisfy the voucher inspection requirement, and landlords may request pre-inspections before a voucher holder moves in."
    citation: "21st Century ROAD to Housing Act"
    url: "https://www.gcrealtyinc.com/blog/new-federal-housing-law-some-changes-already-in-effect"
    notes: "From: The law allows units that were already inspected within the past year under another federal housing program to satisfy the voucher inspection requirement instead of requiring a separate reinspection by the housing authority."
  - id: mined-446
    jurisdiction: "Chicago"
    topic: "Early renewal (90 day rule)"
    rule: "A landlord cannot require a tenant to commit to a renewal more than 90 days out; doing so can cost one month of rent."
    citation: "How to Build a Solid Lease in Chicago"
    url: "https://www.gcrealtyinc.com/blog/how-to-build-a-solid-lease-in-chicago"
    notes: "From: You cannot force a tenant to commit to a renewal more than 90 days out. Do it anyway and it can cost you one month of rent."
  - id: mined-445
    jurisdiction: "Chicago"
    topic: "Owner occupancy waiting period"
    rule: "Buyers must wait at least six months to occupy the property, even if tenants' leases have expired."
    citation: "How Does Controversial Ordinance Impact Your Chicago Rental?"
    url: "https://www.gcrealtyinc.com/blog/how-does-controversial-ordinance-impact-your-chicago-rental"
    notes: "From: Buyers hoping to move into their newly purchased homes must now wait at least six months to occupy the property, even if tenants' leases have expired."
  - id: mined-444
    jurisdiction: "Kendall County, IL"
    topic: "Animal adoption hold period"
    rule: "A one-time hold of 24 hours or end of next business day may be placed on a pet starting when the completed application is received."
    citation: "Adoption and Visitor | Kendall County, IL"
    url: "https://www.kendallcountyil.gov/departments/animal-control/adoption"
    notes: "From: Adoptions are first come first serve, but as a courtesy a one-time hold of 24 hours or end of next business day may be placed on a pet starting when we receive your completed application."
  - id: mined-443
    jurisdiction: "Illinois"
    topic: "Source of income discrimination"
    rule: "Landlords cannot discriminate against a tenant because they pay with a housing voucher."
    citation: "The Subsidy vs. Market Rate Leasing Timeline: Section 8 Subsidy Properties Take Longer, Here Is How Much"
    url: "https://www.gcrealtyinc.com/blog/the-subsidy-vs-market-rate-leasing-timeline-section-8"
    notes: "From: Here's something every Illinois investor needs to understand: under Illinois source of income human rights protections, landlords cannot discriminate against a tenant simply because they pay with a housing voucher."
  - id: mined-442
    jurisdiction: "Chicago / Cook County, IL"
    topic: "Source of income discrimination"
    rule: "As of October 2013, private landlords in Chicago or anywhere in Cook County are legally prohibited from refusing to lease based on source of income."
    citation: "Chicago Section 8 FAQs: A Guide For Property Owners"
    url: "https://www.gcrealtyinc.com/blog/chicago-section-8-faqs-a-guide-for-property-owners"
    notes: "From: - As of October 2013, private landlords with properties available for rent in Chicago, or anywhere in Cook County for that matter, are legally prohibited from refusing to lease to renters based on the source of income."
  - id: mined-441
    jurisdiction: "Chicago"
    topic: "only change under 3564"
    rule: "The only change under HB 3564 is that the fee now has to be disclosed on page one of the lease and in the listing, which was not previously a requirement."
    citation: "HB 3564 Is Now Law: January 2027 Changes for All Illinois Landlords"
    url: "https://www.gcrealtyinc.com/blog/hb-3564-is-now-law-january-2027-changes-for-all-illinois-landlords"
    notes: "From: The only change under HB 3564 is that the fee now has to be disclosed on page one of the lease and in the listing, which was not previously a requirement."
  - id: mined-440
    jurisdiction: "Chicago"
    topic: "one change under 3564"
    rule: "The one change under HB 3564 is that the fee now has to be disclosed on page one of the lease and in the listing."
    citation: "HB 3564 Is Now Law: January 2027 Changes for All Illinois Landlords"
    url: "https://www.gcrealtyinc.com/blog/hb-3564-is-now-law-january-2027-changes-for-all-illinois-landlords"
    notes: "From: The one change under HB 3564 is that the fee now has to be disclosed on page one of the lease and in the listing."
  - id: mined-439
    jurisdiction: "Chicago"
    topic: "Utilities at move-in"
    rule: "All resident-responsible utilities (gas, electricity, water, garbage) must be in the resident's name prior to move in with account numbers provided."
    citation: "Chicago Property Management, Chicago Property Managers, Chicago Property Management Companies. GC Realty & Development, LLC"
    url: "https://www.gcrealtyinc.com/leasing-faq"
    notes: "From: Utilities - All utilities responsible by the resident per the lease must be placed in the resident's name prior to move in and the utility company account numbers provided."
  - id: mined-438
    jurisdiction: "Chicago"
    topic: "Section 8 move-in process"
    rule: "After the Request for Tenancy Approval is submitted, the Housing Authority reviews it within 5 to 7 business days before scheduling a property inspection."
    citation: "Understanding the Move-in Process of Section 8 Tenants"
    url: "https://www.gcrealtyinc.com/blog/understanding-the-move-in-process-of-section-8-tenants"
    notes: "From: Once the Request for Tenancy Approval is submitted, the Housing Authority will review it within 5 to 7 business days."
  - id: mined-437
    jurisdiction: "Cook County"
    topic: "Combined move-in payment"
    rule: "First month's rent and security deposit may be accepted in one check or EFT into one account if the deposit is transferred to a separate compliant account within seven business days."
    citation: "Cook County RTLO"
    url: "https://www.gcrealtyinc.com/blog/what-are-the-security-deposit-changes-in-rtlo"
    notes: "From: How Can I Collect Move in Funds Properly In Cook County - A Landlord may accept the payment of the first month\u2019s rent and security deposit in one check or one electronic funds transfer, and deposit the check or electronic funds transfer into one account if, within seven (7) business days of acceptance of the check or electronic funds transfer, the Landlord transfers the amount of the security deposit into a separate account that complies with this section."
  - id: mined-436
    jurisdiction: "Chicago suburbs (Aurora, Mount Prospect, Streamwood, Des Plaines)"
    topic: "Owner proximity / professional management"
    rule: "Some suburbs require the owner to live within a certain distance, often 30 minutes of the property, or have it professionally managed"
    citation: "Rental Licenses Around Chicago: What Landlords Need To Know Before They Buy, Rent, Or Renew"
    url: "https://www.gcrealtyinc.com/blog/rental-licenses-around-chicago-what-landlords-need-to-know-before-they-buy-rent-or-renew"
    notes: "From: Some suburbs around Chicago have written into their landlord laws that you either:\n- Must live within a certain distance, often 30 minutes of the property, or\n- You must have it professionally managed."
  - id: mined-435
    jurisdiction: "Roselle, IL"
    topic: "Crime-free seminar"
    rule: "There is no crime free requirement for landlords in Roselle."
    citation: "What You Must Know About Renting Your Property In Roselle"
    url: "https://www.gcrealtyinc.com/blog/what-you-must-know-about-renting-your-property-in-roselle"
    notes: "From: There is no crime free requirement for Landlords in Roselle, Illinois."
  - id: mined-434
    jurisdiction: "Federal (HUD)"
    topic: "Assistance animals \u2014 nuisance"
    rule: "Landlord may remove an assistance animal through legal proceedings if there is a nuisance issue"
    citation: "Service & Assistance Animals"
    url: "https://www.gcrealtyinc.com/blog/-service--assistance-animals"
    notes: "From: - If there is a nuisance issue, the landlord does have the right to remove the animal through legal proceedings."
  - id: mined-433
    jurisdiction: "Chicago area"
    topic: "Assistance animals vs. HOA no-pet policy"
    rule: "An emotional support animal is protected under the Fair Housing Act and an HOA no-pet policy cannot override that protection."
    citation: "Fair Housing Act"
    url: "https://www.gcrealtyinc.com/blog/chicagoland-q1-leasing-results"
    notes: "From: The applicant had an emotional support animal, which is protected under the Fair Housing Act and which an HOA policy cannot override."
  - id: mined-432
    jurisdiction: "Illinois"
    topic: "Assistance animals"
    rule: "Illinois enacted the Assistance Animal Integrity Act in 2019; ESAs are not limited by species."
    citation: "Assistance Animal Integrity Act (2019)"
    url: "https://www.gcrealtyinc.com/blog/can-any-pet-be-an-esa-in-illinois"
    notes: "From: That is why, before Illinois passed its Assistance Animal Integrity Act in 2019, landlords in this state were getting accommodation requests for everything from hamsters and pigs to peacocks and sugar gliders."
  - id: mined-431
    jurisdiction: "Chicago"
    topic: "Conversion unit building age"
    rule: "For conversion units, the building must be at least 20 years old."
    citation: "Legalizing Apartments & The New ADU Playbook for Chicago Investors with Samuel Pavlovcik"
    url: "https://www.youtube.com/watch?v=qskibBtqG-0"
    notes: "From: Um so there are opportunities um as long as for conversion units again, the building has to be at least 20 years old."
  - id: mined-430
    jurisdiction: "Federal"
    topic: "Service animals"
    rule: "No deposits of any kind may be collected for service or therapy animals; such animals are not pets."
    citation: "Chicago Property Management, Chicago Property Managers, Chicago Property Management Companies. GC Realty & Development, LLC"
    url: "https://www.gcrealtyinc.com/owner-handbook"
    notes: "From: Fair Housing legislation and the American with Disabilities Act do NOT allow owners or property managers to collect deposits of any kind for service animals."
  - id: mined-429
    jurisdiction: "Federal (ADA)"
    topic: "Service animals"
    rule: "Under the ADA, service animals are individually trained to perform a task related to a disability and are essentially limited to dogs, with a narrow miniature horse provision."
    citation: "Americans with Disabilities Act"
    url: "https://www.gcrealtyinc.com/blog/can-any-pet-be-an-esa-in-illinois"
    notes: "From: A service animal under the Americans with Disabilities Act is individually trained to perform a specific task related to a disability, and federal ADA rules essentially limit service animals to dogs, with a narrow miniature horse provision."
  - id: mined-428
    jurisdiction: "Federal (Fair Housing)"
    topic: "Service and emotional support animals"
    rule: "A \"no pets\" policy is allowed, but landlords cannot deny service animals or emotional support animals."
    citation: "Tenant Screening Red Flags That Drive Me Crazy, But Chicago Landlords Need To Know How To Handle"
    url: "https://www.gcrealtyinc.com/blog/tenant-screening-red-flags-that-drive-me-crazy-but-chicago-landlords-need-to-know-how-to-handle"
    notes: "From: \u201cNo pets\u201d is allowed, but you cannot deny service animals or emotional support animals (ESA)."
  - id: mined-427
    jurisdiction: "Chicago"
    topic: "Proposed landlord registry"
    rule: "Proposed ordinance would create a landlord registry requiring every landlord or significant owner of a building to register with the city."
    citation: "Inside Chicago'sProposed Rental Overhaul"
    url: "https://www.youtube.com/watch?v=Tlg8TSywxgU"
    notes: "From: So, they want a registry where every landlord or significant owner of a building uh has to register with the city."
  - id: mined-426
    jurisdiction: "Chicago"
    topic: "Proposed RLTO overhaul scope"
    rule: "The proposed bill adds 100 new regulations, per the speaker's count."
    citation: "Inside Chicago'sProposed Rental Overhaul"
    url: "https://www.youtube.com/watch?v=Tlg8TSywxgU"
    notes: "From: Um basically, based on our count, this proposed bill adds 100 new regulations, many of which would raise the cost for us to run our buildings and would ultimately lead to higher rents for tenants."
  - id: mined-425
    jurisdiction: "Chicago"
    topic: "Northwest Side Preservation Ordinance penalties"
    rule: "DOH has up to three years to audit a file and may levy fines of up to $1,000 per day for noncompliance"
    citation: "Northwest Side Preservation Ordinance"
    url: "https://www.gcrealtyinc.com/blog/chicago-is-killing-affordable-housing-in-these-neighborhoodsheres-proof"
    notes: "From: The DOH has up to three years to audit a file, potentially levying fines of up to $1,000 per day for noncompliance."
  - id: mined-424
    jurisdiction: "Chicago"
    topic: "Heat ordinance season"
    rule: "Chicago's Heat Ordinance is enforced between September 15th and June 1st each year and applies to residential and commercial spaces; suburbs are exempt."
    citation: "What Is the Chicago Heat Ordinance"
    url: "https://www.gcrealtyinc.com/blog/what-is-the-chicago-heat-ordinance"
    notes: "From: This Ordinance applies to both Residential and Commercial work spaces, and is enforced between September 15th and June 1st of each year."
  - id: mined-423
    jurisdiction: "Federal (HUD HCV)"
    topic: "Inspection repair timelines"
    rule: "Safety issue repairs within 24 hours; other issues typically within 30 days."
    citation: "HUD Housing Choice Voucher Program"
    url: "https://www.hud.gov/helping-americans/housing-choice-vouchers-tenants"
    notes: "From: For safety issues, repairs must be made within 24 hours. Other issues typically need to be fixed within 30 days."
  - id: mined-422
    jurisdiction: "Chicago (CHA / HCV)"
    topic: "HQS re-inspection repair window"
    rule: "Owners have 14 days to make repairs and schedule a re-inspection after a failed HQS inspection"
    citation: "9 Steps for Landlord Success in the HVC Program"
    url: "https://www.gcrealtyinc.com/blog/9-steps-for-landlord-success-in-the-hvc-program"
    notes: "From: If the inspection does not pass, owners are allowed 14 days to make repairs and call CHA to schedule a re-inspection."
  - id: mined-421
    jurisdiction: "Section 8 / HUD"
    topic: "HQS inspection corrections"
    rule: "After the first inspection, landlords have between 21 and 30 calendar days to correct issues and pass the second inspection."
    citation: "What Are Abatements And How To Avoid Them"
    url: "https://www.gcrealtyinc.com/blog/what-are-abatements-and-how-to-avoid-them"
    notes: "From: Once the first inspection has been conducted, landlords have between 21 and 30 calendar days to correct issues and pass the second inspection."
  - id: mined-420
    jurisdiction: "Chicago"
    topic: "CHA annual inspection"
    rule: "CHA reinspects the unit annually to confirm Housing Quality Standards and reviews tenant income at the same time."
    citation: "Section 8 in Chicago: A Landlord's Guide to CHA Vouchers"
    url: "https://www.gcrealtyinc.com/blog/section-8-in-chicago-a-landlords-guide-to-cha-vouchers"
    notes: "From: CHA reinspects the unit annually to confirm it still meets Housing Quality Standards, and the tenant's income is reviewed at the same time to recalculate how much of the rent CHA covers versus how much the tenant owes."
  - id: mined-419
    jurisdiction: "Cook County, IL"
    topic: "Discrimination complaint filing deadline"
    rule: "Complaints must be filed with the Cook County Commission on Human Rights within 180 days of the alleged violation for the Human Rights Ordinance, and within 3 years for the Minimum Wage, Living Wage, and Paid Leave Ordinances."
    citation: "Cook County Human Rights Ordinance"
    url: "https://www.cookcountyil.gov/service/complaint-filing-and-investigation"
    notes: "From: - 180 days of the date of the alleged violation(s) for the Human Rights Ordinance\n- 3 years of the date of the alleged violation(s) for the Minimum Wage, Living Wage, and Paid Leave Ordinances."
  - id: mined-418
    jurisdiction: "Illinois"
    topic: "Discrimination charge filing deadline"
    rule: "A discrimination charge must be filed within 2 years of when the discrimination happened."
    citation: "Charge Process Overview"
    url: "https://dhr.illinois.gov/charge-process/how-the-charge-process-works.html"
    notes: "From: You must file your charge within 2 years of when the discrimination happened."
  - id: mined-417
    jurisdiction: "Illinois"
    topic: "Discrimination charge filing deadline"
    rule: "Most discrimination charges with IDHR must be filed within 2 years of the discrimination; housing cases must be filed within 1 year."
    citation: "IDHR charge process"
    url: "https://dhr.illinois.gov/charge-process/filers.html"
    notes: "From: - Most cases need to be filed within 2 years of when the discrimination happened - For housing cases, you need to file within 1 year of when the discrimination happened"
  - id: mined-416
    jurisdiction: "McHenry County, IL"
    topic: "ADA/civil rights grievance filing deadline"
    rule: "Discrimination complaints must be submitted in writing to the Civil Rights/ADA Coordinator no later than 60 calendar days after the complainant becomes aware of the alleged discriminatory action."
    citation: "Accessibility | McHenry County, IL"
    url: "https://www.mchenrycountyil.gov/county-government/accessibility"
    notes: "From: The complaint should be submitted to the Civil Rights Coordinator/ADA Coordinator at the address cited above as soon as possible, but no later than sixty (60) calendar days after the complainant becomes aware of the alleged discriminatory action."
  - id: mined-415
    jurisdiction: "Cook County, IL (suburban)"
    topic: "RTLO summary attachment"
    rule: "Landlords must attach a summary of the RTLO to every lease and renewal."
    citation: "Cook County Residential Tenant Landlord Ordinance"
    url: "https://www.gcrealtyinc.com/blog/chicagos-fair-housing-ordinance-v2"
    notes: "From: - Landlords must attach a summary of the RTLO to every lease and renewal"
  - id: mined-414
    jurisdiction: "Cook County, IL"
    topic: "RTLO scope"
    rule: "The RTLO limits late fees, security deposit handling, lease clauses and more; non-compliance can mean statutory damages and attorney fees."
    citation: "Cook County RTLO"
    url: "https://www.gcrealtyinc.com/blog/renting-your-property-in-hoffman-estates-rental-market-guide"
    notes: "From: It limits late fees, security deposit handling, lease clauses and much more. Non\u2011compliance can mean statutory damages and attorney fees."
  - id: mined-413
    jurisdiction: "Cook County, IL (suburban)"
    topic: "RTLO applicability"
    rule: "Cook County RTLO applies to most residential rental units in suburban Cook County; it does not apply to Chicago, Evanston, or Mount Prospect."
    citation: "Cook County RTLO, effective June 1, 2021"
    url: "https://www.gcrealtyinc.com/blog/chicagos-fair-housing-ordinance-v2"
    notes: "From: It does not apply to the City of Chicago, Evanston, or Mount Prospect, as those municipalities have their own ordinances."
  - id: mined-412
