    url: "https://www.gcrealtyinc.com/blog/why-chicago-landlords-should-never-take-security-deposits-and-what-to-do-instead"
    notes: "From: - The penalty is severe: If you underpay the interest\u2014even by a few cents\u2014or fail to pay it exactly on time, you can owe the tenant two times the deposit amount plus legal fees. (stated in 2 of your sources)"
  - id: mined-111
    jurisdiction: "Chicago"
    topic: "Security deposit handling and return"
    rule: "CRLTO requires deposits held in a separate interest bearing account at an Illinois financial institution, written disclosure of bank and account, annual interest at the City-set rate, itemized deductions with paid receipts attached within 30 days of move out, and refund of the balance within 45 days"
    citation: "CRLTO"
    url: "https://www.gcrealtyinc.com/blog/what-makes-a-chicagoland-rental-property-hard-to-manage"
    notes: "From: The CRLTO requires owners to hold deposits in a separate interest bearing account at an Illinois financial institution (not commingled with the owner's other funds), provide the tenant with written disclosure of the bank name and account where the deposit is held, pay the tenant interest annually at a rate set by the City of Chicago, deliver itemized written deductions with paid receipts physically attached within 30 days of move out, and refund the remaining balance within 45 days. (stated in 2 of your sources)"
  - id: mined-110
    jurisdiction: "Chicago"
    topic: "Move-in fee cap"
    rule: "Non-refundable move-in fees may not exceed 49% of one month's rent, or they are considered a security deposit."
    citation: "Why Chicago Landlords Should Never Take Security Deposits (and What to Do Instead)"
    url: "https://www.gcrealtyinc.com/blog/why-chicago-landlords-should-never-take-security-deposits-and-what-to-do-instead"
    notes: "From: TIP: You are not able to collect non refundable move-in fees that exceed more then 49% of one month's rent otherwise it is considered a security deposit no matter what you have written in your lease or advertising. (stated in 2 of your sources)"
