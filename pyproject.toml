[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "markai"
version = "0.1.0"
description = "Mark: a Chicagoland landlord advisor grounded only in your curated websites, YouTube episodes, and podcast."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "GC Realty & Development" }]
keywords = ["landlord", "chicago", "real-estate", "rag", "claude", "anthropic"]
dependencies = [
  "anthropic>=1.4,<2",
  "voyageai>=0.5",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "trafilatura>=2.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "youtube-transcript-api>=1.2",
  "feedparser>=6.0",
  "webvtt-py>=0.5",
  "srt>=3.5",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.0",
]

[project.optional-dependencies]
# Local speech-to-text for podcast audio (large download; CPU works, GPU faster).
transcribe = ["faster-whisper>=1.1"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "respx>=0.21",
]

[project.scripts]
mark = "markai.cli:main"

[project.urls]
Repository = "https://github.com/javidiazmx/MarkAI"

[tool.hatch.build.targets.wheel]
packages = ["markai"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option(...) defaults in signatures are idiomatic

[tool.ruff.lint.per-file-ignores]
"markai/sources/template.py" = ["E501"]  # generated: holds sources.yaml verbatim

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
