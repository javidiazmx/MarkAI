name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # youtube-api alongside dev: tests/test_youtube_api.py exercises the official
          # OAuth route with fakes (no real network, no real credentials), but the
          # google-api-python-client/-auth packages it needs are an optional extra for
          # end users, not part of dev - without it these tests fail at runtime with
          # ModuleNotFoundError rather than being skipped.
          pip install -e ".[dev,youtube-api]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q
