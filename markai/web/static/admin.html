<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jay · Admin</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.015em; }
  .tag { color: var(--muted); font-size: 13px; }
  .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }
  .gate {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; max-width: 420px; margin: 0 auto;
  }
  .gate input {
    flex: 1 1 auto; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit;
  }
  .error { color: var(--danger); background: var(--danger-bg); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 13px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .count { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .toolbar input[type="search"] {
    flex: 1 1 220px; min-width: 160px; padding: 7px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit;
  }
  .toolbar select {
    padding: 7px 8px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit;
  }
  .check-label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  #table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13.5px; }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
  thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  tr:last-child td { border-bottom: none; }
  .name { font-weight: 600; }
  .anon-name { font-weight: 500; font-style: italic; color: var(--muted); }
  .contact { color: var(--muted); font-size: 12.5px; }
  .summary-line { margin: 0 0 3px; }
  .signals { display: flex; flex-wrap: wrap; gap: 4px; }
  .signal { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 20px; background: var(--warn-bg); color: var(--warn-ink); }
  .fit { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .fit .note { color: var(--muted); font-size: 11px; }
  .fit .reset { border: none; background: none; color: var(--accent); font-size: 11px; padding: 0; cursor: pointer; }
  .ai-badge {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px;
    border-radius: 20px; background: var(--accent); color: var(--accent-ink);
    text-transform: uppercase; letter-spacing: .03em;
  }
  th.select-col, td.select-col { width: 24px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--user, var(--bg)); }
  tr.row-hidden { opacity: .55; }
  .bulk-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
    background: var(--warn-bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 8px 12px; font-size: 13px;
  }
  .bulk-bar .bulk-count { font-weight: 600; }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-head h2 { margin: 0 0 4px; font-size: 19px; }
  .card-close { border: none; background: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 2px 4px; cursor: pointer; }
  .detail-contact { color: var(--muted); font-size: 13px; margin: 2px 0; }
  .detail-section { margin-top: 18px; }
  .detail-section h3 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted);
  }
  .detail-row { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .detail-row div { color: var(--muted); }
  .detail-row strong { color: var(--ink); font-weight: 600; }
  .loc-pending { font-style: italic; }
  .notes-area {
    width: 100%; min-height: 70px; padding: 8px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; resize: vertical;
  }
  .thread { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .thread-title {
    padding: 8px 12px; background: var(--bg); font-weight: 600; font-size: 13px;
    cursor: pointer; list-style: none;
  }
  .thread-title::-webkit-details-marker { display: none; }
  .thread-title::before { content: "▸ "; color: var(--muted); }
  .thread[open] .thread-title::before { content: "▾ "; }
  .thread-msg { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13.5px; white-space: pre-wrap; }
  .thread-msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 3px; }
  .thread-msg.assistant { background: var(--bg); }
  .ai-verdict { font-weight: 600; margin-bottom: 4px; }
  .ai-verdict.pass { color: var(--success); }
</style>
</head>
<body>
<header>
  <h1>Jay · Admin</h1>
  <span class="tag">Everyone who has used Jay, signed up or not, and who the AI thinks is worth a call.</span>
  <span class="sub" id="count-sub"></span>
</header>
<main>
  <div class="gate" id="gate">
    <label class="vh" for="code">Admin code</label>
    <input id="code" type="password" placeholder="Admin code" autocomplete="off" />
    <button id="unlock" class="btn" type="button">Unlock</button>
  </div>
  <div class="error" id="error" hidden></div>
  <div id="body" hidden>
    <div class="toolbar">
      <label class="vh" for="search">Search visitors</label>
      <input id="search" type="search" placeholder="Search name, email, phone, or summary…" autocomplete="off" />
      <label class="vh" for="filter-signal">Filter by signal</label>
      <select id="filter-signal">
        <option value="">All signals</option>
      </select>
      <label class="check-label"><input type="checkbox" id="filter-good-fit" /> Good fit only</label>
      <label class="vh" for="sort-by">Sort</label>
      <select id="sort-by">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="name">Name (A-Z)</option>
      </select>
      <label class="check-label"><input type="checkbox" id="show-hidden" /> Show hidden</label>
      <button class="btn btn-ghost btn-sm" id="refresh" type="button">Refresh</button>
      <button class="btn btn-sm" id="export-csv" type="button">Export CSV</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bulk-bar" id="bulk-bar" hidden>
      <span class="bulk-count" id="bulk-count"></span>
      <button class="btn btn-sm" id="bulk-hide-btn" type="button">Hide selected</button>
      <button class="btn btn-ghost btn-sm" id="bulk-clear-btn" type="button">Clear selection</button>
    </div>
    <div id="table-wrap"></div>
  </div>
</main>
<div class="scrim" id="detail-scrim" hidden>
  <div class="card" id="detail-card"></div>
</div>
<div class="toast-stack" id="toast-stack"></div>
<script>
(function () {
  "use strict";
  var gate = document.getElementById("gate");
  var codeInput = document.getElementById("code");
  var errorBox = document.getElementById("error");
  var bodyEl = document.getElementById("body");
  var wrap = document.getElementById("table-wrap");
  var countEl = document.getElementById("count");
  var countSub = document.getElementById("count-sub");
  var toastStack = document.getElementById("toast-stack");

  var searchInput = document.getElementById("search");
  var signalFilter = document.getElementById("filter-signal");
  var goodFitFilter = document.getElementById("filter-good-fit");
  var sortSelect = document.getElementById("sort-by");
  var showHiddenToggle = document.getElementById("show-hidden");
  var exportBtn = document.getElementById("export-csv");

  var bulkBar = document.getElementById("bulk-bar");
  var bulkCount = document.getElementById("bulk-count");
  var bulkHideBtn = document.getElementById("bulk-hide-btn");
  var bulkClearBtn = document.getElementById("bulk-clear-btn");

  var SIGNAL_FLAGS = [
    "pm_interest", "tenant_trouble", "self_manage_burnout", "vacancy_help", "buying_interest"
  ];

  var allUsers = [];
  var selectedIds = new Set();

  function adminCode() { return sessionStorage.getItem("mark_admin_code") || ""; }

  function headers() {
    var h = { "Content-Type": "application/json" };
    var code = adminCode();
    if (code) h["X-Admin-Code"] = code;
    return h;
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = !message;
  }

  function showToast(message, kind) {
    var toast = el("div", "toast " + (kind || ""), message);
    toastStack.appendChild(toast);
    setTimeout(function () {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 4000);
  }

  function fmtWhen(seconds) {
    if (!seconds) return "";
    var d = new Date(seconds * 1000);
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });
  }

  function signalLabel(flag) {
    var labels = {
      pm_interest: "Asked about a PM",
      tenant_trouble: "Tenant trouble",
      self_manage_burnout: "Burned out",
      vacancy_help: "Vacancy help",
      buying_interest: "Buying a rental"
    };
    return labels[flag] || flag;
  }

  SIGNAL_FLAGS.forEach(function (flag) {
    var opt = document.createElement("option");
    opt.value = flag;
    opt.textContent = signalLabel(flag);
    signalFilter.appendChild(opt);
  });

  function setOverride(accountId, value) {
    fetch("/api/admin/users/" + encodeURIComponent(accountId) + "/override", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ good_fit: value })
    }).then(function (resp) {
      if (!resp.ok) throw new Error("save failed");
      load();
    }).catch(function () {
      showToast("Could not save that change. Try again.", "error");
    });
  }

  function setHidden(ownerId, hiddenValue) {
    fetch("/api/admin/users/" + encodeURIComponent(ownerId) + "/hidden", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ hidden: hiddenValue })
    }).then(function (resp) {
      if (!resp.ok) throw new Error("save failed");
      showToast(hiddenValue ? "Visitor hidden" : "Visitor restored", "success");
      load();
    }).catch(function () {
      showToast("Could not update that visitor. Try again.", "error");
    });
  }

  function matchesSearch(user, term) {
    if (!term) return true;
    var hay = [user.name, user.email, user.phone]
      .concat(user.summary || [])
      .filter(Boolean)
      .join(" ")
      .toLowerCase();
    return hay.indexOf(term) !== -1;
  }

  function filteredAndSorted() {
    var term = searchInput.value.trim().toLowerCase();
    var signal = signalFilter.value;
    var goodFitOnly = goodFitFilter.checked;
    var list = allUsers.filter(function (u) {
      if (!matchesSearch(u, term)) return false;
      if (signal && (!u.signals || u.signals.indexOf(signal) === -1)) return false;
      if (goodFitOnly && !u.good_fit) return false;
      return true;
    });
    var sortBy = sortSelect.value;
    list.sort(function (a, b) {
      if (sortBy === "oldest") return (a.created_at || 0) - (b.created_at || 0);
      if (sortBy === "name") {
        var an = (a.name || "").toLowerCase();
        var bn = (b.name || "").toLowerCase();
        if (an < bn) return -1;
        if (an > bn) return 1;
        return 0;
      }
      return (b.created_at || 0) - (a.created_at || 0);
    });
    return list;
  }

  function renderFiltered() {
    renderTable(filteredAndSorted());
  }

  function updateBulkBar() {
    var n = selectedIds.size;
    bulkBar.hidden = n === 0;
    bulkCount.textContent = n + " selected";
  }

  function renderRow(user) {
    var tr = el("tr");
    if (user.hidden) tr.classList.add("row-hidden");
    tr.addEventListener("click", function (e) {
      if (e.target.closest("input, button")) return;
      openDetail(user.id);
    });

    var selectTd = el("td", "select-col");
    var selectBox = document.createElement("input");
    selectBox.type = "checkbox";
    selectBox.checked = selectedIds.has(user.id);
    selectBox.setAttribute("aria-label", "Select this visitor");
    selectBox.addEventListener("change", function () {
      if (selectBox.checked) selectedIds.add(user.id);
      else selectedIds.delete(user.id);
      updateBulkBar();
    });
    selectTd.appendChild(selectBox);
    tr.appendChild(selectTd);

    var who = el("td");
    if (user.anonymous) {
      who.appendChild(el("div", "name anon-name", "Anonymous visitor"));
      who.appendChild(el("div", "contact", "Has not signed up"));
    } else {
      who.appendChild(el("div", "name", user.name || "(no name)"));
      who.appendChild(el("div", "contact", user.email || ""));
      if (user.phone) who.appendChild(el("div", "contact", user.phone));
    }
    tr.appendChild(who);

    tr.appendChild(el("td", "", fmtWhen(user.created_at)));

    var summary = el("td");
    if (user.summary && user.summary.length) {
      user.summary.forEach(function (title) {
        summary.appendChild(el("p", "summary-line", title));
      });
    } else {
      summary.appendChild(el("span", "contact", "No conversations yet"));
    }
    tr.appendChild(summary);

    var signals = el("td");
    var signalsWrap = el("div", "signals");
    (user.signals || []).forEach(function (flag) {
      signalsWrap.appendChild(el("span", "signal", signalLabel(flag)));
    });
    signals.appendChild(signalsWrap);
    tr.appendChild(signals);

    var fit = el("td");
    var fitWrap = el("div", "fit");
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !!user.good_fit;
    box.addEventListener("change", function () {
      setOverride(user.id, box.checked);
    });
    fitWrap.appendChild(box);
    if (user.ai_analyzed_at) {
      var aiBadge = el("span", "ai-badge", "AI");
      aiBadge.title = "AI-analyzed" + (user.ai_reasoning ? ": " + user.ai_reasoning : "");
      fitWrap.appendChild(aiBadge);
    }
    if (user.manual_override !== null && user.manual_override !== undefined) {
      fitWrap.appendChild(el("span", "note", "staff set"));
      var reset = el("button", "reset", "reset to AI");
      reset.type = "button";
      reset.addEventListener("click", function () { setOverride(user.id, null); });
      fitWrap.appendChild(reset);
    }
    fit.appendChild(fitWrap);
    tr.appendChild(fit);

    var actions = el("td");
    var hideBtn = el("button", "btn btn-ghost btn-sm", user.hidden ? "Unhide" : "Hide");
    hideBtn.type = "button";
    hideBtn.addEventListener("click", function () {
      setHidden(user.id, !user.hidden);
    });
    actions.appendChild(hideBtn);
    tr.appendChild(actions);

    return tr;
  }

  function renderTable(users) {
    wrap.textContent = "";
    if (!users.length) {
      var emptyBox = el("div", "empty-state");
      emptyBox.appendChild(el("div", "icon", "📭"));
      emptyBox.appendChild(
        el("p", "", allUsers.length ? "No visitors match these filters." : "Nobody has visited Jay yet.")
      );
      wrap.appendChild(emptyBox);
      return;
    }
    var table = el("table");
    var thead = el("thead");
    var headRow = el("tr");
    var selectAllTh = el("th", "select-col");
    var selectAllBox = document.createElement("input");
    selectAllBox.type = "checkbox";
    selectAllBox.setAttribute("aria-label", "Select all visible visitors");
    selectAllBox.checked = users.length > 0 && users.every(function (u) {
      return selectedIds.has(u.id);
    });
    selectAllBox.addEventListener("change", function () {
      users.forEach(function (u) {
        if (selectAllBox.checked) selectedIds.add(u.id);
        else selectedIds.delete(u.id);
      });
      updateBulkBar();
      renderTable(users);
    });
    selectAllTh.appendChild(selectAllBox);
    headRow.appendChild(selectAllTh);
    ["Landlord", "When", "Summary", "Signals", "Good fit for PM", "Actions"].forEach(function (label) {
      headRow.appendChild(el("th", "", label));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    var tbody = el("tbody");
    users.forEach(function (user) { tbody.appendChild(renderRow(user)); });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  function renderSkeleton() {
    wrap.textContent = "";
    var box = el("div");
    for (var i = 0; i < 4; i++) {
      box.appendChild(el("div", "skeleton skeleton-row"));
    }
    wrap.appendChild(box);
  }

  function load() {
    showError("");
    renderSkeleton();
    var url = "/api/admin/users" + (showHiddenToggle.checked ? "?include_hidden=1" : "");
    fetch(url, { headers: headers() })
      .then(function (resp) {
        if (resp.status === 401) {
          gate.hidden = false;
          bodyEl.hidden = true;
          showError("Wrong or missing admin code.");
          return null;
        }
        if (!resp.ok) throw new Error("load failed");
        return resp.json();
      })
      .then(function (data) {
        if (!data) return;
        gate.hidden = true;
        bodyEl.hidden = false;
        allUsers = data.users || [];
        var fits = allUsers.filter(function (u) { return u.good_fit; }).length;
        var signedUp = allUsers.filter(function (u) { return !u.anonymous; }).length;
        var anon = allUsers.length - signedUp;
        countEl.textContent = allUsers.length + " visitor" + (allUsers.length === 1 ? "" : "s") +
          ", " + fits + " flagged as a good fit";
        countSub.textContent = allUsers.length
          ? (signedUp + " signed up, " + anon + " anonymous")
          : "";
        renderFiltered();
      })
      .catch(function () {
        showToast("Could not reach the server. Try refresh.", "error");
        wrap.textContent = "";
      });
  }

  searchInput.addEventListener("input", renderFiltered);
  signalFilter.addEventListener("change", renderFiltered);
  goodFitFilter.addEventListener("change", renderFiltered);
  sortSelect.addEventListener("change", renderFiltered);
  showHiddenToggle.addEventListener("change", load);

  bulkClearBtn.addEventListener("click", function () {
    selectedIds.clear();
    updateBulkBar();
    renderFiltered();
  });

  bulkHideBtn.addEventListener("click", function () {
    var ids = [];
    selectedIds.forEach(function (id) { ids.push(id); });
    if (!ids.length) return;
    bulkHideBtn.disabled = true;
    fetch("/api/admin/users/bulk-hidden", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ owner_ids: ids, hidden: true })
    })
      .then(function (resp) {
        if (!resp.ok) throw new Error("bulk hide failed");
        return resp.json();
      })
      .then(function (data) {
        var n = data && typeof data.count === "number" ? data.count : ids.length;
        showToast(n + " visitor" + (n === 1 ? "" : "s") + " hidden", "success");
        selectedIds.clear();
        updateBulkBar();
        load();
      })
      .catch(function () {
        showToast("Could not hide the selected visitors. Try again.", "error");
      })
      .then(function () {
        bulkHideBtn.disabled = false;
      });
  });

  exportBtn.addEventListener("click", function () {
    var url = "/api/admin/users/export.csv" + (showHiddenToggle.checked ? "?include_hidden=1" : "");
    fetch(url, { headers: headers() })
      .then(function (resp) {
        if (!resp.ok) throw new Error("export failed");
        return resp.blob();
      })
      .then(function (blob) {
        var objectUrl = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = objectUrl;
        link.download = "jay-visitors.csv";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(objectUrl);
      })
      .catch(function () {
        showToast("Could not export the CSV. Try again.", "error");
      });
  });

  // --- the detail view: full contact info, full conversations, and a best-effort location --

  var scrim = document.getElementById("detail-scrim");
  var card = document.getElementById("detail-card");

  function closeDetail() {
    scrim.hidden = true;
    card.textContent = "";
  }

  scrim.addEventListener("click", function (e) {
    if (e.target === scrim) closeDetail();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !scrim.hidden) closeDetail();
  });

  // Collapsed by default and opened by clicking the title - a visitor with several
  // conversations used to dump every message from every one of them into the card at once,
  // which is also most of why the card ran off the bottom of the screen with no way back.
  function renderThread(thread) {
    var box = el("details", "thread");
    box.appendChild(el("summary", "thread-title", thread.title || "New conversation"));
    (thread.messages || []).forEach(function (m) {
      var role = m.role === "assistant" ? "assistant" : "user";
      var msg = el("div", "thread-msg " + role);
      msg.appendChild(el("div", "who", role === "assistant" ? "Jay" : "Them"));
      var body = el("div");
      body.textContent = m.content || "";
      msg.appendChild(body);
      box.appendChild(msg);
    });
    return box;
  }

  function locationLine(ip) {
    var line = el("div", "detail-contact loc-pending", "Location: looking up " + ip + "…");
    // A best-effort client-side lookup, not a stored fact - a free geo-IP lookup by IP,
    // nothing sent about the visitor beyond the address already on file for them.
    fetch("https://ipapi.co/" + encodeURIComponent(ip) + "/json/")
      .then(function (resp) { return resp.ok ? resp.json() : null; })
      .then(function (data) {
        line.classList.remove("loc-pending");
        if (!data || data.error) {
          line.textContent = "Location: could not resolve " + ip;
          return;
        }
        var parts = [data.city, data.region, data.country_name].filter(Boolean);
        line.textContent = "Location: " + (parts.length ? parts.join(", ") : "unknown") +
          " (" + ip + ")";
      })
      .catch(function () {
        line.classList.remove("loc-pending");
        line.textContent = "Location: could not resolve " + ip;
      });
    return line;
  }

  function saveNotes(ownerId, text) {
    fetch("/api/admin/users/" + encodeURIComponent(ownerId) + "/notes", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ notes: text })
    }).then(function (resp) {
      if (!resp.ok) throw new Error("save failed");
      showToast("Notes saved", "success");
    }).catch(function () {
      showToast("Could not save notes. Try again.", "error");
    });
  }

  function analyzeUser(ownerId, btn) {
    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Analyzing…";
    fetch("/api/admin/users/" + encodeURIComponent(ownerId) + "/analyze", {
      method: "POST",
      headers: headers()
    })
      .then(function (resp) {
        return resp.json().catch(function () { return {}; }).then(function (data) {
          if (!resp.ok) throw new Error(data.detail || "Could not analyze this visitor.");
          return data;
        });
      })
      .then(function () {
        showToast("AI analysis complete", "success");
        openDetail(ownerId);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = originalText;
        showToast((err && err.message) || "Could not analyze this visitor.", "error");
      });
  }

  function renderAiSection(user, ownerId) {
    var section = el("div", "detail-section");
    section.appendChild(el("h3", "", "AI Analysis"));

    if (!user.ai_analyzed_at) {
      var analyzeBtn = el("button", "btn btn-sm", "Analyze with AI");
      analyzeBtn.type = "button";
      analyzeBtn.addEventListener("click", function () {
        analyzeUser(ownerId, analyzeBtn);
      });
      section.appendChild(analyzeBtn);
      return section;
    }

    var verdict = el(
      "div",
      "ai-verdict " + (user.ai_good_fit ? "pass" : "danger-text"),
      "AI says: " + (user.ai_good_fit ? "Good fit" : "Not a fit")
    );
    section.appendChild(verdict);
    if (user.ai_reasoning) {
      section.appendChild(el("p", "detail-contact", user.ai_reasoning));
    }
    var reanalyzeBtn = el("button", "btn btn-ghost btn-sm", "Re-analyze");
    reanalyzeBtn.type = "button";
    reanalyzeBtn.addEventListener("click", function () {
      analyzeUser(ownerId, reanalyzeBtn);
    });
    section.appendChild(reanalyzeBtn);
    return section;
  }

  function openDetail(ownerId) {
    card.textContent = "";
    card.appendChild(el("p", "contact", "Loading…"));
    scrim.hidden = false;

    fetch("/api/admin/users/" + encodeURIComponent(ownerId), { headers: headers() })
      .then(function (resp) {
        if (!resp.ok) throw new Error("load failed");
        return resp.json();
      })
      .then(function (user) {
        card.textContent = "";

        var head = el("div", "card-head");
        var titleWrap = el("div");
        titleWrap.appendChild(
          el("h2", "", user.anonymous ? "Anonymous visitor" : (user.name || "(no name)"))
        );
        if (!user.anonymous) {
          if (user.email) titleWrap.appendChild(el("div", "detail-contact", user.email));
          if (user.phone) titleWrap.appendChild(el("div", "detail-contact", user.phone));
          if (user.neighborhood) titleWrap.appendChild(el("div", "detail-contact", user.neighborhood));
        } else {
          titleWrap.appendChild(el("div", "detail-contact", "Has not signed up"));
        }
        if (user.hidden) titleWrap.appendChild(el("div", "detail-contact", "Hidden from the main list"));
        if (user.last_ip) {
          titleWrap.appendChild(locationLine(user.last_ip));
        } else {
          // Their address is only captured from a question asked after this feature shipped -
          // an older visitor with none on file is not a bug, just nothing to look up yet.
          titleWrap.appendChild(
            el("div", "detail-contact", "Location: not on file yet - ask a new question to capture it")
          );
        }
        head.appendChild(titleWrap);
        var close = el("button", "card-close", "×");
        close.type = "button";
        close.setAttribute("aria-label", "Close");
        close.addEventListener("click", closeDetail);
        head.appendChild(close);
        card.appendChild(head);

        var flags = el("div", "detail-section");
        flags.appendChild(el("h3", "", "Signals"));
        var signalsWrap = el("div", "signals");
        if (user.signals && user.signals.length) {
          user.signals.forEach(function (flag) {
            signalsWrap.appendChild(el("span", "signal", signalLabel(flag)));
          });
        } else {
          signalsWrap.appendChild(el("span", "detail-contact", "None yet"));
        }
        flags.appendChild(signalsWrap);
        card.appendChild(flags);

        card.appendChild(renderAiSection(user, ownerId));

        var notesSection = el("div", "detail-section");
        notesSection.appendChild(el("h3", "", "Notes"));
        var notesArea = el("textarea", "notes-area");
        notesArea.rows = 3;
        notesArea.placeholder = "Private staff notes…";
        notesArea.value = user.notes || "";
        notesArea.addEventListener("blur", function () {
          saveNotes(ownerId, notesArea.value);
        });
        notesSection.appendChild(notesArea);
        card.appendChild(notesSection);

        var convos = el("div", "detail-section");
        convos.appendChild(el("h3", "", "Full conversation"));
        if (user.threads && user.threads.length) {
          user.threads.forEach(function (thread) {
            convos.appendChild(renderThread(thread));
          });
        } else {
          convos.appendChild(el("p", "contact", "No conversations yet."));
        }
        card.appendChild(convos);
      })
      .catch(function () {
        card.textContent = "";
        card.appendChild(el("p", "error", "Could not load this visitor. Close and try again."));
      });
  }

  function unlock() {
    sessionStorage.setItem("mark_admin_code", codeInput.value.trim());
    codeInput.value = "";
    load();
  }
  document.getElementById("unlock").addEventListener("click", unlock);
  // The field sits outside a <form>, so Enter otherwise does nothing - the landlord-facing
  // page's own access-code gate gets the same fix, so both feel like a normal login field.
  codeInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") { event.preventDefault(); unlock(); }
  });
  document.getElementById("refresh").addEventListener("click", load);

  if (adminCode()) load();
})();
</script>
</body>
</html>
